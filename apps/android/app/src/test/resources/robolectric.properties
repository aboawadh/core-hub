# The JVM (Robolectric) tests run on the Android 15 (API 35) framework although the app compiles
# against and targets API 36: Robolectric 4.16 runs its API 36 framework only on Java 21, and the
# project builds and tests on Java 17 (android.yml, docs/harness). What these tests check — the
# reducers, the Compose UI, the strings — does not depend on the API 36 behaviour changes, which
# docs/changes/2026-09-27-twuijri-android-target-36.md lists and checks one by one.
sdk=35
