name: Release

# Builds the server image and publishes it to GHCR. Two ways in: a version tag on main
# (the normal release), or the owner pressing "Run workflow" on a branch and choosing a
# tag name (a preview image). Both publish only from this workflow (TEAM-RULES §6).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish (e.g. preview, test, 0.1.0-rc.1). "latest" is refused.'
        required: true
        default: preview
      platforms:
        description: 'Platforms to build'
        required: true
        default: linux/amd64
        type: choice
        options: [linux/amd64, 'linux/amd64,linux/arm64']

permissions:
  contents: read
  packages: write
  pull-requests: read # the Hermes line: the watch's open pull request (hermes-watch.yml)
  issues: read # the Hermes line: the watch's open issue

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and push ghcr.io image
    runs-on: ubuntu-latest
    # Two platforms (amd64 + arm64 under QEMU) outgrew 30 minutes with 1.1.3 (run 36308150240).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Refuse tags that are not on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo '::error::Release tags must point at a commit on main.'
            exit 1
          fi
      # One version for every deliverable (docs/RELEASING.md): the root package.json's. A tag
      # must say the same (the check fails otherwise); a manual run is a preview of it, named
      # with its run number so two previews never report the same version.
      - name: The version this image reports
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node scripts/version-check.mjs
          root=$(node -p "require('./package.json').version")
          if [ "$EVENT" = workflow_dispatch ]; then
            version="$root-preview.$GITHUB_RUN_NUMBER"
          else
            version="$root"
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
      # A line, never a gate (DECISIONS §132, docs/RELEASING.md "The Hermes watch"): which Hermes
      # this image carries, whether a newer stable Hermes exists, and what the daily Hermes watch
      # found about it (its open pull request = supported, its open issue = not yet). The image is
      # built from the pinned HERMES_REF whatever this says, and a failed lookup changes nothing.
      - name: The Hermes this image carries, and any newer one
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/hermes-watch.mjs status --repo "$GITHUB_REPOSITORY" \
            --annotate --step-summary "$GITHUB_STEP_SUMMARY" \
          || echo "::warning title=Hermes::Could not check for a Hermes newer than the pinned $(sed -n 's/^ARG HERMES_REF=//p' packages/server/Dockerfile); look at the Hermes watch by hand."
      - name: Refuse a manual run that would overwrite latest
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ inputs.image_tag }}" in
            latest|main)
              echo '::error::A manual run may not publish "latest"; that tag belongs to a release tag on main.'
              exit 1
              ;;
          esac
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          # The version the image reports and the footer prints: the root version for a release
          # tag (which must match it), `<root>-preview.<run>` for a manual run.
          build-args: |
            COREHUB_VERSION=${{ steps.version.outputs.version }}
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
